<!-- Streamlabs Tip/Donation: keep message template "{name} doou {amount}!" -->
<div id="alert-image-wrap" style="display:none"><div id="alert-image">{img}</div></div>
<div id="alert-text-wrap">
  <div id="alert-text">
    <div class="donation-stage">
      <div class="cheque" aria-label="Cheque recebido">
        <div class="cheque-header"><span class="cheque-bank">NOSTALGIA BANK</span><span class="cheque-id">GMRsVoiage • 2004</span></div>
        <div class="cheque-label">PAGAR POR ESTE CHEQUE A</div>
        <div id="alert-message" class="cheque-payment">{messageTemplate}</div>
        <div class="cheque-rule"></div>
        <div class="cheque-bottom"><span>APOIO À TRANSMISSÃO</span><span class="cheque-decoration">≋ 00 00 20 04 ≋</span></div>
        <div class="paid-stamp" aria-hidden="true">COMPENSADO</div>
      </div>
      <div class="assistant">
        <svg class="clippy" width="104" height="130" viewBox="0 0 104 130" role="img" aria-label="Assistente clipe de papel">
          <defs><linearGradient id="metal" x1="0" x2="1"><stop stop-color="#526b88"/><stop offset=".38" stop-color="#fff"/><stop offset=".72" stop-color="#9caabc"/><stop offset="1" stop-color="#536b87"/></linearGradient></defs>
          <path d="M70 97 L70 36 Q70 8 48 8 Q28 8 28 30 L28 95 Q28 117 49 117 Q68 117 68 96 L68 43 Q68 29 55 29 Q43 29 43 43 L43 96" fill="none" stroke="#59667a" stroke-width="14" stroke-linecap="round"/>
          <path d="M70 97 L70 36 Q70 8 48 8 Q28 8 28 30 L28 95 Q28 117 49 117 Q68 117 68 96 L68 43 Q68 29 55 29 Q43 29 43 43 L43 96" fill="none" stroke="url(#metal)" stroke-width="10" stroke-linecap="round"/>
          <ellipse cx="38" cy="38" rx="13" ry="18" fill="#fff" stroke="#627d99" stroke-width="2"/><ellipse cx="62" cy="37" rx="13" ry="18" fill="#fff" stroke="#627d99" stroke-width="2"/>
          <ellipse cx="43" cy="42" rx="4" ry="6" fill="#303d53"/><ellipse cx="58" cy="41" rx="4" ry="6" fill="#303d53"/>
          <path d="M34 61 Q51 72 67 58" fill="none" stroke="#43566b" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="speech">
          <div class="speech-title">Assistente Nostalgia.exe</div>
          <div id="alert-user-message">{userMessage}</div>
          <div id="speech-fallback">Parece que você recebeu uma doação!</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Streamlabs Alert Box > Twitch > Followers: message template must be {name} -->
<div id="alert-image-wrap" aria-hidden="true" style="display:none"><div id="alert-image">{img}</div></div>
<div id="alert-text-wrap">
  <div id="alert-text">
    <div class="gmrs-follow-window" role="status" aria-label="Novo seguidor">
      <div class="gmrs-titlebar">
        <span class="gmrs-app-dot"></span>
        <span class="gmrs-app-name">Nostalgia.exe</span>
        <span class="gmrs-title-separator">/</span>
        <span>Messenger</span>
        <span class="gmrs-window-controls" aria-hidden="true"><i>—</i><i>×</i></span>
      </div>
      <div class="gmrs-content">
        <div class="gmrs-avatar-frame">
          <img class="gmrs-avatar" src="https://raw.githubusercontent.com/GMRsVoiage/stream/main/buddy/viewer_idle.svg" alt="" />
          <span class="gmrs-online" aria-hidden="true"></span>
        </div>
        <div class="gmrs-follow-copy">
          <div class="gmrs-eyebrow">NOVO CONTATO ONLINE</div>
          <div id="alert-message">{messageTemplate}</div>
          <div class="gmrs-subtitle">começou a seguir seu canal!</div>
        </div>
      </div>
      <div class="gmrs-footer"><span class="gmrs-footer-dot"></span><span>GMRsVoiage</span><span class="gmrs-footer-divider">·</span><span>Contato adicionado</span></div>
    </div>
  </div>
</div>

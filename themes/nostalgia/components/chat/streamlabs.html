<!-- Nostalgia.exe — código para o campo HTML personalizado do Chat Box.
     Preserva o formato e os placeholders enviados pelo usuário.
     Não usar como página estática de preview: este template precisa do motor do widget. -->

<!-- As mensagens são inseridas automaticamente neste contêiner. -->
<div id="log" class="sl__chat__layout"></div>

<!-- Modelo de cada mensagem. -->
<script type="text/template" id="chatlist_item">
  <div data-from="{from}" data-id="{messageId}">
    <span class="meta" style="color: {color}">
      <span class="badges"></span>
      <span class="name">{from}</span>
    </span>
    <span class="message">{message}</span>
  </div>
</script>

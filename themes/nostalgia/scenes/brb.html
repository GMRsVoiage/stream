<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nostalgia.exe — Voya BRB Layer</title>
  <link rel="stylesheet" href="./brb.css">
  <script defer src="./brb.js"></script>
</head>
<body>
  <!--
    This is ONLY the transparent Voya layer. Keep the approved chibi bedroom
    as an OBS Image source, and your existing live chat as a separate
    Browser Source. No redundant room drawing, fixed chat or fake messages.
    Add ?sprite=YOUR_SAME_ORIGIN_ASSET_URL after the character art is approved.
  -->
  <main class="voya-world" aria-label="Camada da Voya no BRB">
    <svg id="voya-debug" class="voya-debug" viewBox="0 0 1920 1080" preserveAspectRatio="none" hidden aria-label="Calibração do chão"><polygon id="walk-boundary"/><g id="walk-vertices"></g></svg>
    <div id="voya-character" class="voya-character" hidden aria-label="Voya"></div>
    <div id="voya-marker" class="voya-marker" hidden>PÉS ↓</div>
    <div id="voya-debug-note" class="voya-debug-note" hidden>CALIBRAÇÃO — ÁREA VERDE: CAMINHO PRELIMINAR<br/>Aguardando print do OBS para ajustar limites.</div>
  </main>
</body>
</html>

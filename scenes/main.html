<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>AquaWave — Main Overlay</title>
  <link rel="stylesheet" href="../css/scenes.css">
</head>
<body>
  <main class="overlay-root main-overlay" aria-label="Overlay principal AquaWave">
    <img class="planet" src="../assets/planet.svg" alt="">
    <div class="palms"></div>
    <div class="horizon-glow"></div>
    <div class="synth-grid"></div>

    <section class="main-overlay__goal gmrs-goal" style="--progress: 18%;">
      <div class="gmrs-goal__line">
        <span>StreamDeck Caseiro</span>
        <span>R$ 54 / R$ 300</span>
      </div>
      <div class="gmrs-goal__track"><div class="gmrs-goal__fill"></div></div>
    </section>

    <section class="main-overlay__brand gmrs-lower-third">
      <div>
        <strong>Rafaelmanu001</strong>
        <small>GMRsVoiage // Games · Tech · Live</small>
      </div>
    </section>

    <aside class="main-overlay__retro" aria-label="Elementos retrô decorativos">
      <div class="gmrs-window">
        <div class="gmrs-window__titlebar">
          <span>coffee.cup</span>
          <span class="gmrs-window__controls"><i class="gmrs-window__control"></i></span>
        </div>
        <div class="gmrs-window__body">loading... 100%</div>
      </div>
      <div class="gmrs-window">
        <div class="gmrs-window__titlebar">
          <span>C:/stream/rafaelmanu001.exe</span>
          <span class="gmrs-window__controls">
            <i class="gmrs-window__control"></i><i class="gmrs-window__control"></i>
          </span>
        </div>
        <div class="gmrs-window__body">Broadcast ready. Have fun!</div>
      </div>
    </aside>

    <div class="scanlines"></div>
  </main>
</body>
</html>

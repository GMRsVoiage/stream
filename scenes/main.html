<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>AquaWave — Dark Synthwave Main</title>
  <link rel="stylesheet" href="../css/scenes.css">
</head>
<body>
  <main class="overlay-root main-overlay" aria-label="Overlay principal Dark Synthwave">
    <div class="main-overlay__shade"></div>
    <img class="synth-sun" src="../assets/synth-sun.svg" alt="">
    <div class="palms palms--main"></div>
    <div class="horizon-glow"></div>
    <div class="synth-grid synth-grid--animated"></div>

    <section class="main-overlay__goal gmrs-goal" style="--progress: 18%;">
      <div class="gmrs-goal__line">
        <span>StreamDeck Caseiro</span>
        <span>R$ 54 / R$ 300</span>
      </div>
      <div class="gmrs-goal__track"><div class="gmrs-goal__fill"></div></div>
    </section>

    <section class="main-overlay__brand gmrs-lower-third">
      <div>
        <strong>Rafaelmanu001</strong>
        <small>GMRsVoiage // Games · Tech · Live</small>
      </div>
    </section>

    <aside class="main-overlay__retro" aria-label="Elementos retrô decorativos">
      <div class="gmrs-window gmrs-window--dark">
        <div class="gmrs-window__titlebar">
          <span>stream.status</span>
          <span class="gmrs-window__controls"><i class="gmrs-window__control"></i></span>
        </div>
        <div class="gmrs-window__body">ONLINE // NIGHT MODE</div>
      </div>
      <div class="gmrs-window gmrs-window--dark">
        <div class="gmrs-window__titlebar">
          <span>C:/gmrs/rafaelmanu001.exe</span>
          <span class="gmrs-window__controls">
            <i class="gmrs-window__control"></i><i class="gmrs-window__control"></i>
          </span>
        </div>
        <div class="gmrs-window__body">broadcast initialized_</div>
      </div>
    </aside>

    <div class="scanlines scanlines--dark"></div>
  </main>
</body>
</html>

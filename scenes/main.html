<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080">
  <title>AquaWave — Dark Synthwave Main</title>
  <link rel="stylesheet" href="../css/scenes.css">
  <script defer src="../js/scene-config.js"></script>
</head>
<body>
  <main class="overlay-root main-overlay" aria-label="Overlay principal Dark Synthwave">
    <div class="main-overlay__shade"></div>
    <img class="synth-sun" src="../assets/synth-sun.svg" alt="">
    <div class="palms palms--main"></div>
    <div class="horizon-glow"></div>
    <div class="synth-grid synth-grid--animated"></div>

    <section class="main-overlay__brand gmrs-lower-third">
      <div>
        <strong data-scene-name>RAFAELMANU001</strong>
        <small><span data-scene-game>GMRsVoiage</span> // <span data-scene-status>AO VIVO</span></small>
      </div>
    </section>

    <div class="aero-popup aero-popup--one">
      <div class="aero-popup__title">
        <span class="aero-popup__orb"></span>
        <span>Broadcast Center</span>
        <i>×</i>
      </div>
      <div class="aero-popup__body">
        <strong data-scene-status>AO VIVO</strong>
        <span>overlay sincronizado</span>
      </div>
    </div>

    <div class="aero-popup aero-popup--two">
      <div class="aero-popup__title">
        <span class="aero-popup__orb aero-popup__orb--pink"></span>
        <span>Aplicativo em foco</span>
        <i>×</i>
      </div>
      <div class="aero-popup__body">
        <strong data-scene-game>GMRsVoiage</strong>
        <span>perfil de cena carregado</span>
      </div>
    </div>

    <div class="aero-popup aero-popup--three">
      <div class="aero-popup__title">
        <span class="aero-popup__orb aero-popup__orb--violet"></span>
        <span>GMRsVoiage</span>
        <i>×</i>
      </div>
      <div class="aero-popup__body">
        <strong>AquaWave</strong>
        <span>broadcast system ready</span>
      </div>
    </div>

    <div class="scanlines scanlines--dark"></div>
  </main>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=512,height=512">
  <title>Rafaelmanu001 — Synthwave Sun Profile Base</title>
  <link rel="stylesheet" href="../css/scenes.css">
  <link rel="stylesheet" href="../css/aquawave-sync.css">
  <style>
    html,body{width:512px;height:512px;margin:0;overflow:hidden;background:#080517}
    body{display:grid;place-items:center}
  </style>
</head>
<body>
  <main class="profile-synth" aria-label="Base de ícone AquaWave pronta para receber uma foto">
    <div class="sync-stars profile-synth__stars"></div>
    <img class="profile-synth__sun" src="../assets/synth-sun.svg" alt="Sol Synthwave">
    <div class="sync-orbit profile-synth__orbit-a"></div>
    <div class="sync-orbit profile-synth__orbit-b"></div>
    <div class="profile-synth__safe" aria-hidden="true"></div>
    <div class="scanlines scanlines--dark"></div>
  </main>
</body>
</html>

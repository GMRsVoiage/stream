<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=512,height=512">
  <title>Rafaelmanu001 — Marble Vaporwave Profile</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:512px;height:512px;margin:0;overflow:hidden}
    body{
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 50% 42%,rgba(105,70,255,.28),transparent 37%),
        linear-gradient(180deg,#0a071d 0%,#10082b 63%,#05030f 100%);
    }
    .icon{
      position:relative;
      width:472px;
      height:472px;
      overflow:hidden;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 45%,rgba(255,62,210,.08),transparent 46%),
        #09061d;
      border:5px solid #2bdff3;
      box-shadow:
        0 0 0 7px #171034,
        0 0 0 10px rgba(255,62,210,.72),
        0 0 36px rgba(43,223,243,.2);
    }
    .sun{
      position:absolute;
      width:355px;
      height:355px;
      left:58px;
      top:66px;
      opacity:.86;
      filter:saturate(.9);
    }
    .bust{
      position:absolute;
      width:388px;
      height:464px;
      left:43px;
      bottom:-34px;
      filter:
        drop-shadow(-10px 8px 0 rgba(255,62,210,.14))
        drop-shadow(10px 4px 0 rgba(43,223,243,.12));
    }
    .grain{
      position:absolute;
      inset:0;
      opacity:.055;
      background:repeating-linear-gradient(180deg,#fff 0,#fff 1px,transparent 1px,transparent 4px);
      pointer-events:none;
    }
  </style>
</head>
<body>
  <main class="icon" aria-label="Ícone Vaporwave com busto de mármore">
    <img class="sun" src="../assets/synth-sun.svg" alt="">
    <img class="bust" src="../assets/marble-bust.svg" alt="Busto clássico de mármore">
    <div class="grain"></div>
  </main>
</body>
</html>

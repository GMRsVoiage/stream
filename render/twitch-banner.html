<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=1200,height=480">
  <title>Rafaelmanu001 — Twitch Banner</title>
  <link rel="stylesheet" href="../css/scenes.css">
  <link rel="stylesheet" href="../css/aquawave-sync.css">
</head>
<body style="width:1200px;height:480px;">
  <main class="banner" aria-label="Banner da Twitch">
    <div class="sync-stars banner__stars"></div>
    <img class="planet" src="../assets/planet.svg" alt="">
    <img class="banner__sun" src="../assets/synth-sun.svg" alt="">

    <div class="sync-orbit banner__orbit-a"></div>
    <div class="sync-orbit banner__orbit-b"></div>

    <div class="banner__ambient"></div>
    <div class="palms"></div>
    <div class="horizon-glow"></div>
    <div class="synth-grid"></div>

    <section class="banner__copy">
      <span class="banner__eyebrow">AQUAWAVE BROADCAST</span>
      <h1>RAFAELMANU001</h1>
      <p>GMRsVoiage // GAMES · TECH · LIVE</p>

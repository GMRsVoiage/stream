<!-- Streamlabs Chat Box > Custom HTML -->
<div id="log" class="sl__chat__layout"></div>
<script type="text/template" id="chatlist_item">
  <div class="chat-item" data-from="{from}" data-id="{messageId}">
    <img class="buddy" src="https://raw.githubusercontent.com/GMRsVoiage/stream/main/buddy/viewer_idle.svg" alt="" aria-hidden="true">
    <div class="bubble">
      <div class="meta" style="color: {color}"><span class="badges"></span><span class="name">{from}</span></div>
      <div class="message">{message}</div>
    </div>
  </div>
</script>
